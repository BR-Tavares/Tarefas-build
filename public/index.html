<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0B6BCB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Missões" />
  <title>Missões — Folha Única</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function() {
      try {
        var tema = localStorage.getItem('tarefas_tema_fundo') || 'amarelo';
        var temas = {
          amarelo: { bg: '#FDE047', surface: '#FACC15', surfaceInner: '#FEF08A', border: '#CA8A04', borderStrong: '#854D0E' },
          bege: { bg: '#E5D3BD', surface: '#D2B48C', surfaceInner: '#EAD7C0', border: '#A88456', borderStrong: '#6E4E27' },
          verde: { bg: '#86EFAC', surface: '#4ADE80', surfaceInner: '#BBF7D0', border: '#16A34A', borderStrong: '#14532D' },
          azul: { bg: '#93C5FD', surface: '#60A5FA', surfaceInner: '#BFDBFE', border: '#2563EB', borderStrong: '#1E3A8A' },
          cinza: { bg: '#CBD5E1', surface: '#94A3B8', surfaceInner: '#E2E8F0', border: '#64748B', borderStrong: '#334155' }
        };
        var t = temas[tema] || temas.amarelo;
        var root = document.documentElement;
        root.style.setProperty('--bg', t.bg);
        root.style.setProperty('--surface', t.surface);
        root.style.setProperty('--surface-inner', t.surfaceInner);
        root.style.setProperty('--border', t.border);
        root.style.setProperty('--border-strong', t.borderStrong);
        root.setAttribute('data-tema', tema);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header id="topbar" class="topbar" style="display:none;">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span id="brand-titulo">Missões</span>
      </div>
      <nav id="nav-acoes" class="nav-links"></nav>
    </div>
  </header>

  <main id="app-root">
    <div class="container-folha" style="margin-top: 48px; text-align: center;">
      <div class="card">
        <p class="secao-sub">Carregando aplicativo de missões...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
