<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0B6BCB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Missões" />
  <title>Missões — Folha Única</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function() {
      try {
        var tema = localStorage.getItem('tarefas_tema_fundo') || 'amarelo';
        var temas = {
          amarelo: { bg: '#FEF9C3', surface: '#FEF08A', surfaceInner: '#FEF9C3', border: '#EAB308', borderStrong: '#CA8A04' },
          bege: { bg: '#F5EBE1', surface: '#EAD7C0', surfaceInner: '#F5EBE1', border: '#C8A97E', borderStrong: '#997345' },
          verde: { bg: '#DCFCE7', surface: '#BBF7D0', surfaceInner: '#DCFCE7', border: '#4ADE80', borderStrong: '#16A34A' },
          azul: { bg: '#DBEAFE', surface: '#BFDBFE', surfaceInner: '#DBEAFE', border: '#60A5FA', borderStrong: '#2563EB' },
          cinza: { bg: '#F1F5F9', surface: '#E2E8F0', surfaceInner: '#F8FAFC', border: '#94A3B8', borderStrong: '#475569' }
        };
        var t = temas[tema] || temas.amarelo;
        var root = document.documentElement;
        root.style.setProperty('--bg', t.bg);
        root.style.setProperty('--surface', t.surface);
        root.style.setProperty('--surface-inner', t.surfaceInner);
        root.style.setProperty('--border', t.border);
        root.style.setProperty('--border-strong', t.borderStrong);
        root.setAttribute('data-tema', tema);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header id="topbar" class="topbar" style="display:none;">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span id="brand-titulo">Missões</span>
      </div>
      <nav id="nav-acoes" class="nav-links"></nav>
    </div>
  </header>

  <main id="app-root">
    <div class="container-folha" style="margin-top: 48px; text-align: center;">
      <div class="card">
        <p class="secao-sub">Carregando aplicativo de missões...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
