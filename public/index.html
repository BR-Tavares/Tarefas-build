<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0B6BCB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Missões" />
  <title>Missões — Folha Única</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function() {
      try {
        var tema = localStorage.getItem('tarefas_tema_fundo') || 'amarelo';
        var temas = {
          amarelo: { bg: '#FBF3C4', surface: '#FFFDEB', border: '#E8DC94', borderStrong: '#A89940' },
          bege: { bg: '#EDE0D0', surface: '#FAF5EE', border: '#DAC7B2', borderStrong: '#998368' },
          verde: { bg: '#D5ECD9', surface: '#EDF8EE', border: '#AFD7B6', borderStrong: '#5E9B68' },
          azul: { bg: '#D2E7FA', surface: '#ECF5FD', border: '#A9CEF3', borderStrong: '#518CC4' },
          cinza: { bg: '#DFE2E6', surface: '#F4F5F7', border: '#BCC1C8', borderStrong: '#767C85' }
        };
        var t = temas[tema] || temas.amarelo;
        var root = document.documentElement;
        root.style.setProperty('--bg', t.bg);
        root.style.setProperty('--surface', t.surface);
        root.style.setProperty('--border', t.border);
        root.style.setProperty('--border-strong', t.borderStrong);
        root.setAttribute('data-tema', tema);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header id="topbar" class="topbar" style="display:none;">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span id="brand-titulo">Missões</span>
      </div>
      <nav id="nav-acoes" class="nav-links"></nav>
    </div>
  </header>

  <main id="app-root">
    <div class="container-folha" style="margin-top: 48px; text-align: center;">
      <div class="card">
        <p class="secao-sub">Carregando aplicativo de missões...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
